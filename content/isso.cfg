# Isso 运行配置（本包在首次启动时生成本文件并注入随机管理口令）。
# 修改后重启应用生效。完整配置项见官方文档：
# https://isso-comments.de/docs/reference/server-config/

[general]
# 评论数据库位置（容器内 /db 已持久化）
dbpath = /db/comments.db
# 允许嵌入评论的站点来源；实际使用请改成你自己的站点域名，
# 例如 https://example.com（多个来源可换行写多个 host）
host = http://localhost

[admin]
enabled = true
# 首次启动时由部署参数注入的随机口令替换此占位符
password = __ISSO_ADMIN_PW__

[moderation]
# 开启后新评论需在管理后台人工通过才会展示
enabled = false

[server]
listen = http://0.0.0.0:8080
